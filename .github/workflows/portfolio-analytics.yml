name: Refresh public portfolio analytics
on:
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
      - portfolio/obsidian-2027
    paths:
      - scripts/update_analytics.py
      - .github/workflows/portfolio-analytics.yml
permissions:
  contents: read
concurrency:
  group: portfolio-analytics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/portfolio/obsidian-2027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
      - name: Verify renderer
        run: python3 scripts/update_analytics.py --self-test
      - name: Refresh public metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_analytics.py
      - name: Commit generated images
        run: |
          git add assets/analytics/milestones-{dark,light}.svg assets/analytics/languages-{dark,light}.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public portfolio analytics'
          git push origin "HEAD:${GITHUB_REF}"
